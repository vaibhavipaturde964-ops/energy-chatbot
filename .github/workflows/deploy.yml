name: EcoBot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Smoke Test
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyflakes
          # Install app deps (torch cpu-only to keep CI fast)
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt

      # ── 4. Lint with flake8 ───────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          # Fail on syntax errors or undefined names; warn on style
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics
          flake8 . \
            --count \
            --exit-zero \
            --max-line-length=120 \
            --statistics \
            --exclude=.venv,__pycache__,data,vector_db

      # ── 5. Smoke-test imports ─────────────────────────────────────────────
      - name: Smoke test — verify app imports
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          import sys, os
          # Patch streamlit so importing app.py doesn't launch the server
          import unittest.mock as mock
          sys.modules['streamlit'] = mock.MagicMock()
          # Verify query_engine loads without crashing
          import query_engine
          print('query_engine imported successfully')
          "

      # ── 6. Check required files exist ─────────────────────────────────────
      - name: Verify required deployment files
        run: |
          for f in app.py query_engine.py requirements.txt vector_db/chroma.sqlite3; do
            if [ ! -e "$f" ]; then
              echo "MISSING: $f" && exit 1
            fi
          done
          echo "All required files present."
